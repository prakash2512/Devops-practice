server {
    if ($host = www.zenmoovz.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = zenmoovz.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name zenmoovz.com www.zenmoovz.com;
    return 404; # managed by Certbot




}

